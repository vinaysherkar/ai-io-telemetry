[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-io-telemetry"
version = "0.1.0"
description = "Zero-overhead profiler to detect GPU starvation and storage I/O bottlenecks during distributed LLM training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vinay Sherkar" }
]
keywords = ["gpu", "ebpf", "storage", "pytorch", "nvme", "observability"]
dependencies = [
    "pynvml>=11.5.0",
    "psutil>=5.9.0",
    "rich>=13.0.0"
]

[project.scripts]
ai-io-telemetry = "ai_io_telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
